[Fork]
; Rarities listed here are NEVER salvaged by auto salvage or the bag
; sweep, even if an exact rule matches them. The keep list always wins.
;   0 = Common    1 = Uncommon    2 = Rare    3 = Epic    4 = Legendary
; Examples: "4" keeps only Legendary. "3,4" keeps Epic and Legendary.
; "none" keeps nothing. The rules panel's rarity checkboxes rewrite
; this value in game.
KeepRarities=4

; 1 = anything not protected above is salvaged the moment it lands in
;     the backpack (farming low-level areas).
; 0 = nothing is salvaged automatically; use rules or the panel's
;     Salvage Bag button. The rules panel's Auto Salvage toggle
;     rewrites this value in game.
AutoSalvage=0

; 1 = auto salvage and the sweep only ever touch the backpack.
; The action bar is never salvaged. Equipped items are never salvaged
; either way (that check stays hard-coded, like the original).
BackpackOnly=1

; 1 = log PAGE_PROBE lines (page, category, item ids) for diagnosing
; the inventory page layout. Developer diagnostic; leave 0 normally.
PageProbe=0
